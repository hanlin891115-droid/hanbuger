<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>闖關教育遊戲範本</title>
<style>
  /* =========================================================
     外觀設定
     預設是可愛風。GAME.theme 可以換成另外四套主題(warm / parchment / scifi / terminal),
     每套主題只是把下面這組變數換掉,不影響遊戲邏輯。
     想微調配色:改 :root(可愛風)或對應主題區塊裡的變數,不要把顏色散寫到各個元件裡。
     ========================================================= */
  :root {
    --bg: #eee8ff;          /* 背景 */
    --dot: #dcd2ff;         /* 背景花紋 */
    --paper: #fffdf7;       /* 卡片 */
    --surface: #fff;        /* 按鈕、輸入框的底色 */
    --soft: #fff3c4;        /* 已填入、已選取的底色 */
    --ink: #3b3355;         /* 文字 */
    --edge: #3b3355;        /* 描邊 */
    --muted: #8a82a6;       /* 次要文字 */
    --pink: #ff8fb1;        /* 主色(主要按鈕) */
    --on-primary: #3b3355;  /* 主色上的文字 */
    --mint: #7ed8b5;        /* 答對 */
    --on-good: #3b3355;
    --good-text: #2f9c73;
    --butter: #ffd86b;      /* 強調 */
    --on-accent: #3b3355;
    --lav: #c9bbff;         /* * # 按鍵 */
    --peach: #ffc2a8;       /* 刪除鍵 */
    --bad: #ff6f7d;         /* 答錯 */
    --clue-bg: #fff8e1;     /* 線索卡 */
    --clue-ink: #3b3355;
    --clue-paper: #fff;     /* 線索卡裡小圖卡、插圖的底色 */
    --bw: 3px;
    --radius: 18px;
    --card-radius: 32px;
    --line: var(--bw) solid var(--edge);
    --pop: 0 5px 0 var(--edge);      /* 貼紙感的實心陰影 */
    --pop-press: 0 1px 0 var(--edge);
    --card-shadow: 0 8px 0 var(--edge);
    --bg-image: radial-gradient(var(--dot) 3px, transparent 3.5px);
    --bg-size: 28px 28px;
    --font: "jf-openhuninn-2.0", "jf open 粉圓 2.0", "Zen Maru Gothic", "M PLUS Rounded 1c",
            "Arial Rounded MT Bold", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  /* 溫暖 / 烘焙坊 / 農場 / 童話小鎮:奶油色底、木頭色描邊、橘色主色 */
  :root[data-theme="warm"] {
    --bg: #fbf1e3; --dot: #f1dcc0; --paper: #fffaf2; --surface: #fff; --soft: #ffe8c7;
    --ink: #5a3a22; --edge: #8a5a35; --muted: #a07a5a;
    --pink: #f29f58; --on-primary: #3a2312; --mint: #9cc77a; --on-good: #2f3d1e; --good-text: #4f8a2b;
    --butter: #f6c95f; --on-accent: #3a2312; --lav: #e8cfa8; --peach: #f5b7a0; --bad: #d9534f;
    --clue-bg: #fff4dc; --clue-ink: #5a3a22; --clue-paper: #fff;
    --bw: 2px; --radius: 14px; --card-radius: 24px;
    --pop: 0 4px 0 var(--edge); --pop-press: 0 1px 0 var(--edge);
    --card-shadow: 0 6px 0 var(--edge), 0 18px 40px rgba(90,58,34,.18);
    --bg-image: radial-gradient(var(--dot) 2px, transparent 2.5px); --bg-size: 22px 22px;
  }
  /* 古典 / 鍊金 / 古宅:深色木質、黃銅描邊、羊皮紙線索卡 */
  :root[data-theme="parchment"] {
    --bg: #0f0c0a; --dot: #2a211a; --paper: #1c1815; --surface: #0c0a09; --soft: #4a3a14;
    --ink: #f4ebd0; --edge: #b8973d; --muted: #a89f8c;
    --pink: #d4af37; --on-primary: #1a160d; --mint: #3f9d6b; --on-good: #fff; --good-text: #6ee7a8;
    --butter: #d4af37; --on-accent: #1a160d; --lav: #4a3f6b; --peach: #7c4a2d; --bad: #ef5350;
    --clue-bg: radial-gradient(ellipse at center, #fbf7ea 0%, #e8dcbf 75%, #cfba91 100%); --clue-ink: #382818; --clue-paper: #fbf7ea;
    --bw: 2px; --radius: 10px; --card-radius: 16px;
    --pop: 0 3px 8px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.12);
    --pop-press: 0 1px 2px rgba(0,0,0,.6);
    --card-shadow: 0 20px 50px rgba(0,0,0,.8), inset 0 0 30px rgba(212,175,55,.08);
    --bg-image: radial-gradient(circle at 50% 10%, var(--dot) 0%, transparent 65%); --bg-size: auto;
    --font: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
  }
  /* 科幻 / 太空 / 深海基地:深藍底、青色螢光 HUD */
  :root[data-theme="scifi"] {
    --bg: #050b14; --dot: rgba(34,211,238,.07); --paper: #0a1522; --surface: #06101b; --soft: #0e3a4a;
    --ink: #d7f3ff; --edge: #22d3ee; --muted: #6b8ba4;
    --pink: #22d3ee; --on-primary: #03121a; --mint: #10b981; --on-good: #03121a; --good-text: #34d399;
    --butter: #fbbf24; --on-accent: #1a1200; --lav: #1e3a5f; --peach: #5b2333; --bad: #ff4d5e;
    --clue-bg: #071a29; --clue-ink: #a5f3fc; --clue-paper: #06101b;
    --bw: 1px; --radius: 6px; --card-radius: 10px;
    --pop: 0 0 0 1px rgba(34,211,238,.2), 0 0 12px rgba(34,211,238,.25);
    --pop-press: 0 0 4px rgba(34,211,238,.5);
    --card-shadow: 0 0 40px rgba(34,211,238,.18), inset 0 0 60px rgba(34,211,238,.04);
    --bg-image: linear-gradient(var(--dot) 1px, transparent 1px), linear-gradient(90deg, var(--dot) 1px, transparent 1px);
    --bg-size: 32px 32px;
    --font: "Share Tech Mono", Consolas, "SF Mono", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", monospace;
  }
  /* 復古終端機 / 駕駛艙 / 懸疑:CRT 綠字、琥珀色強調、掃描線 */
  :root[data-theme="terminal"] {
    --bg: #0a0e14; --dot: rgba(51,255,119,.05); --paper: #111a24; --surface: #090d14; --soft: #1d3323;
    --ink: #d6ffe4; --edge: #2f6b47; --muted: #78909c;
    --pink: #33ff77; --on-primary: #04140a; --mint: #33ff77; --on-good: #04140a; --good-text: #33ff77;
    --butter: #ffaa33; --on-accent: #1a0f00; --lav: #1f2f45; --peach: #4a2a1a; --bad: #ff3344;
    --clue-bg: #0c1410; --clue-ink: #33ff77; --clue-paper: #090d14;
    --bw: 1px; --radius: 4px; --card-radius: 6px;
    --pop: 0 2px 0 rgba(0,0,0,.7); --pop-press: 0 0 0 rgba(0,0,0,.7);
    --card-shadow: 0 0 0 1px #000, 0 0 30px rgba(51,255,119,.12);
    --bg-image: linear-gradient(var(--dot) 50%, transparent 50%); --bg-size: 100% 4px;
    --font: Consolas, "SF Mono", "Courier New", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", monospace;
  }
  /* 水墨 / 國畫:宣紙底、濃淡墨色、朱砂印章色、楷體 */
  :root[data-theme="ink"] {
    --bg: #e9e0ca; --dot: rgba(60,48,36,.07); --paper: #f6f0df; --surface: #fbf7ea; --soft: #e6dcc3;
    --ink: #25211d; --edge: #3a342e; --muted: #7a7064;
    --pink: #b5342a; --on-primary: #fbf3e4; --mint: #7a9a7c; --on-good: #14241a; --good-text: #3f6b4a;
    --butter: #b98a3e; --on-accent: #fbf3e4; --lav: #d9d0b8; --peach: #e6cdbb; --bad: #a3271f;
    --clue-bg: #efe5c8; --clue-ink: #2a241e; --clue-paper: #fbf7ea;
    --bw: 1.5px; --radius: 4px; --card-radius: 6px;
    --pop: 0 2px 0 rgba(37,33,29,.4); --pop-press: 0 0 0 rgba(37,33,29,.4);
    --card-shadow: 0 0 0 5px var(--paper), 0 0 0 6.5px var(--edge), 0 14px 36px rgba(37,33,29,.22);
    --bg-image: radial-gradient(ellipse at 15% 20%, rgba(37,33,29,.10) 0%, transparent 45%), radial-gradient(ellipse at 85% 85%, rgba(37,33,29,.13) 0%, transparent 50%), radial-gradient(var(--dot) 1px, transparent 1.5px);
    --bg-size: auto, auto, 9px 9px;
    --font: "DFKai-SB", "BiauKai", "Kaiti TC", "STKaiti", "KaiTi", "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", serif;
  }
  :root[data-theme="ink"] .icon-badge { border-radius: 6px; background: var(--pink); color: var(--on-primary); border-color: var(--pink); transform: rotate(-3deg); }
  :root[data-theme="ink"] h1 { letter-spacing: .12em; }
  /* 注音:字右邊直排(台灣課本寫法)。用縮放而不是縮小字級,避免瀏覽器的「最小字級」把注音撐大;大小跟著文字走 */
  .zy-run { overflow-wrap: anywhere; }
  .zy { display: inline-flex; align-items: center; white-space: nowrap; }
  .zy-p { position: relative; flex: none; align-self: stretch; width: .4em; margin: 0 .08em 0 .06em; }
  .zy-p.tn { width: .6em; }
  .zy-in { position: absolute; left: 0; top: 50%; display: inline-flex; align-items: center; transform: translateY(-50%) scale(.36); transform-origin: left center;
    font-size: 1em; line-height: 1; font-weight: 400; font-style: normal; letter-spacing: 0; white-space: nowrap; font-family: "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
  .zy-p.light .zy-in { flex-direction: column; transform: translateY(-50%) scale(.32); }
  .zy-b { writing-mode: vertical-rl; text-orientation: upright; letter-spacing: 0; line-height: 1; }
  .zy-m { margin-left: .08em; }
  .zy-p.light .zy-m { margin-left: 0; line-height: .8; }
  .no-zy .zy-p { display: none; }
  .no-zy .zy { display: inline; }
  /* 文字不要超出方框 */
  .card, .qa-box, .clue, .clue-body, .clue-title, .explain, .feedback, .choice, .scene, .story, .question, .badge, .hint-tier, #hint-body { overflow-wrap: anywhere; word-break: normal; min-width: 0; max-width: 100%; }
  .choice, .btn-primary, .btn-secondary, .clue-reveal, .tool-btn { white-space: normal; }
  #btn-zy { position: fixed; top: 8px; right: 8px; z-index: 50; font: inherit; font-size: .8rem; padding: 4px 10px; cursor: pointer;
    background: var(--surface); color: var(--ink); border: var(--bw) solid var(--edge); border-radius: var(--radius); box-shadow: var(--pop); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image: var(--bg-image);
    background-size: var(--bg-size);
    color: var(--ink);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    position: relative;
    width: 100%;
    max-width: 640px;
    background: var(--paper);
    border: var(--line);
    border-radius: var(--card-radius);
    padding: 30px 26px 28px;
    box-shadow: var(--card-shadow);
  }
  h1 { font-size: 1.7rem; margin: 6px 0 8px; text-align: center; letter-spacing: .03em; }
  p.desc { color: var(--muted); margin: 0 0 22px; line-height: 1.7; text-align: center; }

  /* ----- 吉祥物(純 SVG,只在可愛風顯示)與主題圖示(其他主題顯示 GAME.icon) ----- */
  .mascot { display: block; margin: 0 auto; width: 110px; height: 96px; }
  .mascot.small { width: 64px; height: 56px; }
  .mascot .mouth-happy, .mascot .mouth-sad { display: none; }
  .mascot.happy .mouth-idle, .mascot.sad .mouth-idle { display: none; }
  .mascot.happy .mouth-happy { display: inline; }
  .mascot.sad .mouth-sad { display: inline; }
  .mascot.happy, .icon-badge.happy { animation: hop .5s ease; }
  .mascot.sad, .icon-badge.sad { animation: wobble .4s ease; }
  .icon-badge {
    display: none; margin: 0 auto 6px; width: 84px; height: 84px; border-radius: 50%;
    border: var(--line); background: var(--surface); box-shadow: var(--pop);
    align-items: center; justify-content: center; font-size: 2.6rem; line-height: 1;
  }
  .icon-badge.small { width: 48px; height: 48px; font-size: 1.5rem; margin: 0; flex: none; }
  :root[data-theme]:not([data-theme="cute"]) .mascot { display: none; }
  :root[data-theme]:not([data-theme="cute"]) .icon-badge { display: flex; }
  @keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-12px); } }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 30% { transform: rotate(-8deg); } 70% { transform: rotate(8deg); } }

  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: var(--radius);
    border: var(--line);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 1.05rem;
    margin-bottom: 18px;
    outline: none;
  }
  input[type="text"]:focus { box-shadow: 0 0 0 4px var(--butter); }
  button { font: inherit; cursor: pointer; color: var(--ink); }
  button:focus-visible { outline: 4px solid var(--butter); outline-offset: 2px; }
  button:disabled { cursor: default; }
  .btn-primary, .btn-secondary {
    width: 100%;
    border: var(--line);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 1.15rem;
    font-weight: 700;
    box-shadow: var(--pop);
    transition: transform .08s, box-shadow .08s, filter .15s;
  }
  .btn-primary { background: var(--pink); color: var(--on-primary); }
  .btn-secondary { background: var(--butter); color: var(--on-accent); margin-top: 18px; }
  .btn-primary:hover:not(:disabled), .btn-secondary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn-primary:active, .btn-secondary:active { transform: translateY(4px); box-shadow: var(--pop-press); }
  .btn-primary:disabled { opacity: .55; }

  /* ----- 故事框(開始畫面的背景故事、結局) ----- */
  .story {
    background: var(--clue-bg); color: var(--clue-ink);
    border: var(--line); border-radius: var(--radius);
    padding: 14px 18px; margin: 0 0 18px; line-height: 1.8; white-space: pre-line; font-size: .98rem;
  }

  /* ----- 遊戲畫面上方:圖示、關卡進度、倒數、愛心 ----- */
  .game-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .progress-area { flex: 1; min-width: 0; }
  .progress-wrap {
    background: var(--surface);
    border: var(--line);
    border-radius: 999px;
    height: 22px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: repeating-linear-gradient(-45deg, var(--pink) 0 10px, var(--butter) 10px 20px);
    border-right: var(--line);
    transition: width .45s cubic-bezier(.3,1.4,.6,1);
  }
  .stepper { display: flex; align-items: center; }
  .step {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    border: var(--line); background: var(--surface); color: var(--muted);
    display: flex; align-items: center; justify-content: center; font-size: .85rem; font-weight: 700;
    transition: background .3s, transform .3s;
  }
  .step.done { background: var(--mint); color: var(--on-good); }
  .step.now { background: var(--butter); color: var(--on-accent); transform: scale(1.18); box-shadow: var(--pop-press); }
  .step-line { flex: 1; height: var(--bw); min-width: 4px; background: var(--muted); opacity: .45; }
  .step-line.done { background: var(--mint); opacity: 1; }
  .timer {
    flex: none; border: var(--line); border-radius: 999px; background: var(--surface);
    padding: 4px 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .timer.danger { color: var(--bad); border-color: var(--bad); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  .hearts { font-size: 1.15rem; letter-spacing: 1px; white-space: nowrap; }

  /* ----- 道具袋與工具列 ----- */
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .inventory {
    flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    border: var(--bw) dashed var(--muted); border-radius: var(--radius); padding: 6px 10px; min-height: 44px;
  }
  .inventory .inv-label { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .item-chip {
    flex: none; border: var(--line); border-radius: 999px; background: var(--surface);
    padding: 3px 12px 3px 6px; font-size: .88rem; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center;
  }
  .item-chip .item-ico { display: inline-flex; vertical-align: middle; margin-right: 6px; }
  .item-chip .item-ico svg { width: 30px; height: 30px; display: block; }
  .item-chip.new { animation: pop .4s ease, glow 1.2s ease 2; }
  @keyframes glow { 50% { box-shadow: 0 0 0 5px var(--butter); } }
  .tool-btn {
    flex: none; margin-left: auto; border: var(--line); border-radius: 999px; background: var(--surface);
    padding: 7px 14px; font-size: .95rem; font-weight: 700; box-shadow: var(--pop-press);
  }
  .tool-btn + .tool-btn { margin-left: 0; }
  .tool-btn:hover { background: var(--soft); }

  /* ----- 關卡內容:標題、場景、插圖、線索卡、題目 ----- */
  .level-body.enter { animation: fadeUp .35s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .level-title {
    display: inline-block;
    background: var(--butter);
    color: var(--on-accent);
    border: var(--line);
    border-radius: 999px;
    padding: 4px 14px;
    font-size: .95rem;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .scene { color: var(--muted); line-height: 1.8; margin: 0 0 12px; font-style: italic; white-space: pre-line; }
  .art { margin: 0 0 14px; }
  .art svg, .clue-body svg { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  /* 線索卡的底色和內文不同,裡面的插圖、小圖卡改用線索卡的配色(--ink、--surface 在卡片裡會換掉) */
  .clue, .explain, .hint-tier { --ink: var(--clue-ink); --muted: var(--clue-ink); --surface: var(--clue-paper); }
  .teacher { margin: 0 0 16px; border: var(--bw) dashed var(--muted); border-radius: var(--radius); padding: 8px 14px; color: var(--muted); font-size: .92rem; line-height: 1.7; white-space: pre-line; }
  .teacher summary { cursor: pointer; font-weight: 700; }
  .clue {
    background: var(--clue-bg); color: var(--clue-ink);
    border: var(--line); border-radius: var(--radius);
    padding: 12px 16px; margin: 0 0 12px; line-height: 1.8;
  }
  .clue-title { margin: 0 0 4px; font-size: .9rem; letter-spacing: .08em; opacity: .75; }
  .clue-body { white-space: pre-line; font-weight: 700; }
  .clue-body.revealed { animation: develop 1s ease; }
  @keyframes develop { from { opacity: 0; filter: blur(6px); } to { opacity: 1; filter: none; } }
  .clue-reveal {
    border: var(--bw) dashed currentColor; border-radius: var(--radius); background: transparent; color: inherit;
    padding: 8px 14px; font-weight: 700; width: 100%;
  }
  .clue-reveal:hover { background: rgba(127,127,127,.15); }
  /* 插圖用的小圖卡:art 或線索的 html 裡寫 <div class="props"><div class="prop">…</div>…</div> */
  .props { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; white-space: normal; }
  .prop {
    flex: 1 1 70px; max-width: 150px; min-height: 84px; border: var(--line); border-radius: var(--radius);
    background: var(--surface); color: var(--ink); padding: 8px 6px; text-align: center; line-height: 1.5;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 700;
  }
  .prop small { color: var(--muted); font-weight: 400; font-size: .75rem; }
  .prop .big { font-size: 1.8rem; line-height: 1.2; }
  /* 題目 + 作答區:同一個大框 */
  .qa-box {
    background: var(--surface); border: calc(var(--bw) + 1px) solid var(--pink);
    border-radius: var(--radius); padding: 14px 14px 12px; margin: 14px 0 16px; box-shadow: var(--pop);
  }
  .question {
    display: flex; align-items: flex-start; gap: 12px;
    font-size: 1.3rem; margin: 0 0 14px; padding: 0 0 12px; line-height: 1.6; font-weight: 700; white-space: pre-line;
    border-bottom: var(--bw) dashed var(--muted);
  }
  .question::before {
    content: "題"; flex: none; display: grid; place-items: center; width: 2em; height: 2em;
    background: var(--pink); color: var(--on-primary); border-radius: calc(var(--radius) / 2);
    font-size: .85rem; line-height: 1; letter-spacing: 0;
  }
  .qa-box .feedback:empty { display: none; }
  /* 原文:要看的句子或短文,最明顯;提醒:小抄,最小最淡 */
  .clue-tag { display: inline-block; line-height: 1.5; padding: 0 8px; margin-right: 8px; border-radius: 3px; vertical-align: middle; letter-spacing: .1em; }
  .clue-source { border: 3px solid var(--edge); box-shadow: var(--pop); padding: 16px 18px; margin: 16px 0 12px; }
  .clue-source .clue-title { font-size: 1rem; opacity: 1; margin-bottom: 8px; }
  .clue-source .clue-body { font-size: 1.3rem; line-height: 1.9; font-weight: 700; }
  .clue-source .clue-tag { font-size: .85rem; padding: 1px 10px; background: var(--clue-ink); color: var(--clue-bg); }
  .clue-tip { border: 1px dashed var(--muted); border-radius: calc(var(--radius) / 2); font-size: .74rem; line-height: 1.5; padding: 4px 10px; margin: 0 0 6px; opacity: .72; }
  .clue-tip .clue-title { font-size: .72rem; margin: 0; opacity: 1; display: inline; font-weight: 400; }
  .clue-tip .clue-body { font-weight: 400; display: inline; }
  .clue-tip .clue-tag { font-size: .62rem; padding: 0 5px; margin-right: 5px; border: 1px solid currentColor; }
  .clue-tip .clue-reveal { padding: 2px 10px; font-size: .74rem; width: auto; }

  /* ----- 選擇題、複選題按鈕 ----- */
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: var(--line);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 12px;
    font-size: 1.1rem;
    box-shadow: var(--pop);
    transition: transform .08s, box-shadow .08s, background .15s;
  }
  .choice:hover:not(:disabled) { background: var(--soft); }
  .choice:active:not(:disabled) { transform: translateY(4px); box-shadow: var(--pop-press); }
  .choice.picked { background: var(--soft); box-shadow: var(--pop-press); transform: translateY(4px); }
  .choice.picked::before { content: "✓ "; }
  .choice.correct { background: var(--mint); color: var(--on-good); }
  .choice.wrong { background: var(--bad); color: #fff; animation: shake .3s; }

  /* ----- 密碼輸入格 ----- */
  .passcode-display { display: flex; justify-content: center; gap: 10px; margin: 4px 0 14px; flex-wrap: wrap; }
  .passcode-slot {
    width: 58px; height: 68px;
    border: var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 2.1rem; font-weight: 700;
  }
  .passcode-slot.filled { background: var(--soft); animation: pop .18s ease; }
  .passcode-shake { animation: shake .3s; }
  @keyframes pop { 0% { transform: scale(.8); } 100% { transform: scale(1); } }

  /* ----- 大尺寸鍵盤(電話鍵盤排列:1-9、* 0 #,最下排刪除與確認) ----- */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-top: 6px;
  }
  .key {
    min-height: 76px;
    border: var(--line);
    border-radius: calc(var(--radius) + 6px);
    background: var(--surface);
    font-size: 2.1rem;
    font-weight: 700;
    box-shadow: var(--pop);
    transition: transform .08s, box-shadow .08s;
    touch-action: manipulation;
    user-select: none;
  }
  .key:active:not(:disabled), .key.pressed { transform: translateY(4px); box-shadow: var(--pop-press); }
  .key:disabled { opacity: .6; }
  .key.symbol { background: var(--lav); }
  .key.back { background: var(--peach); font-size: 1.5rem; }
  .key.confirm { background: var(--mint); color: var(--on-good); grid-column: span 2; font-size: 1.5rem; }

  /* ----- 轉輪鎖 dial ----- */
  .dial { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 4px 0 16px; flex-wrap: wrap; }
  .wheel { display: flex; flex-direction: column; align-items: stretch; gap: 6px; }
  .wheel-label { text-align: center; font-size: .8rem; font-weight: 700; color: var(--muted); max-width: 90px; }
  .wheel-btn {
    min-width: 58px; height: 38px; border: var(--line); border-radius: var(--radius); background: var(--surface);
    font-size: 1rem; box-shadow: var(--pop-press); touch-action: manipulation;
  }
  .wheel-btn:active:not(:disabled) { transform: translateY(1px); }
  .wheel-val {
    min-width: 58px; height: 68px; padding: 0 8px; border: var(--line); border-radius: var(--radius); background: var(--soft);
    display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700;
  }
  .wheel-val.turn { animation: pop .15s ease; }
  .wheel-val.long { font-size: 1.25rem; white-space: nowrap; }
  .dial-sep { font-size: 2rem; font-weight: 700; }

  /* ----- 順序機關 sequence ----- */
  .seq-trail { min-height: 40px; text-align: center; font-weight: 700; font-size: 1.1rem; margin-bottom: 10px; color: var(--muted); }
  .seq-grid { display: grid; gap: 12px; margin-bottom: 12px; }
  .seq-btn {
    min-height: 72px; border: var(--line); border-radius: var(--radius); background: var(--surface);
    font-size: 1.15rem; font-weight: 700; box-shadow: var(--pop); white-space: pre-line; line-height: 1.4;
    transition: transform .08s, box-shadow .08s, background .2s; touch-action: manipulation;
  }
  .seq-btn:active:not(:disabled), .seq-btn.lit { transform: translateY(4px); box-shadow: var(--pop-press); background: var(--butter); color: var(--on-accent); }
  .seq-btn { position: relative; }
  .seq-btn.on { background: var(--soft); }
  .seq-btn.on::after {
    content: attr(data-n); position: absolute; top: 4px; right: 6px; min-width: 22px; height: 22px; padding: 0 5px;
    border-radius: 999px; background: var(--butter); color: var(--on-accent); font-size: .75rem; line-height: 22px;
  }
  .seq-btn.blocked { opacity: .45; border-style: dashed; box-shadow: none; }
  .cup {
    position: relative; width: 110px; height: 200px; margin: 0 auto 12px; overflow: hidden;
    border: var(--line); border-top: none; border-radius: 0 0 18px 18px; background: var(--surface);
  }
  .cup .water { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--mint); opacity: .75; transition: height .2s; }
  .cup::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to top, transparent 0 calc(var(--tick) - 1px), var(--muted) calc(var(--tick) - 1px) var(--tick));
    -webkit-mask: linear-gradient(90deg, #000 30%, transparent 30%); mask: linear-gradient(90deg, #000 30%, transparent 30%);
  }
  .link-btn { border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 6px; display: block; margin: 0 auto; }

  /* ----- 計數 counter(可以加上天平)、滑桿 slider(可以加上羅盤) ----- */
  .stepper-row { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 6px 0 16px; }
  .round-btn {
    width: 60px; height: 60px; border-radius: 50%; border: var(--line); background: var(--surface);
    font-size: 1.8rem; font-weight: 700; box-shadow: var(--pop); line-height: 1; touch-action: manipulation;
  }
  .round-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: var(--pop-press); }
  .readout { min-width: 110px; text-align: center; font-size: 2.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .readout small { font-size: 1.1rem; margin-left: 4px; color: var(--muted); }
  .balance { position: relative; height: 150px; margin: 0 auto 8px; max-width: 320px; }
  .balance .pillar { position: absolute; left: 50%; top: 14px; width: 10px; height: 118px; margin-left: -5px; background: var(--edge); border-radius: 4px; }
  .balance .base { position: absolute; left: 50%; bottom: 8px; width: 110px; height: 12px; margin-left: -55px; background: var(--edge); border-radius: 6px; }
  .balance .beam {
    --tilt: 0deg; position: absolute; left: 10%; right: 10%; top: 18px; height: 8px; border-radius: 4px;
    background: var(--butter); border: 1px solid var(--edge); transform: rotate(var(--tilt)); transition: transform .6s cubic-bezier(.3,1.5,.6,1);
  }
  .balance .pan {
    position: absolute; top: 6px; width: 96px; margin-left: -48px; padding-top: 44px; text-align: center;
    transform-origin: 50% 0; transform: rotate(calc(var(--tilt) * -1)); transition: transform .6s cubic-bezier(.3,1.5,.6,1);
    background: linear-gradient(var(--edge), var(--edge)) 50% 0 / 2px 44px no-repeat;
  }
  .balance .pan.left { left: 0; } .balance .pan.right { left: 100%; }
  .balance .pan span {
    display: block; border: var(--line); border-top-width: 1px; border-radius: 4px 4px 40px 40px; background: var(--surface);
    padding: 4px 6px 8px; font-weight: 700; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  input[type="range"].slider { width: 100%; margin: 4px 0 16px; accent-color: var(--pink); height: 32px; }
  .compass {
    position: relative; width: 150px; height: 150px; margin: 0 auto 10px; border-radius: 50%;
    border: var(--line); background: var(--surface); box-shadow: var(--pop);
  }
  .compass::before { content: "N"; position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-size: .8rem; font-weight: 700; color: var(--muted); }
  .compass .needle {
    position: absolute; left: 50%; bottom: 50%; width: 6px; height: 56px; margin-left: -3px; border-radius: 3px;
    background: var(--bad); transform-origin: 50% 100%; transition: transform .15s;
  }
  .compass-mark { position: absolute; font-size: .8rem; font-weight: 700; color: var(--muted); font-style: normal; }
  .compass-mark.e { right: 7px; top: 50%; transform: translateY(-50%); }
  .compass-mark.s { bottom: 4px; left: 0; right: 0; text-align: center; }
  .compass-mark.w { left: 7px; top: 50%; transform: translateY(-50%); }
  .compass::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: var(--edge); }

  /* ----- 放置 assign:把物件放進格子 ----- */
  .slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .slot {
    min-height: 86px; border: var(--bw) dashed var(--edge); border-radius: var(--radius); background: transparent;
    padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  }
  .slot .slot-label { font-size: .85rem; color: var(--muted); }
  .slot .slot-item { font-weight: 700; font-size: 1.1rem; min-height: 1.4em; }
  .slot.filled { border-style: solid; background: var(--soft); }
  .chip.selected { background: var(--butter); color: var(--on-accent); transform: translateY(-4px); }
  /* 拖曳 */
  .chip.draggable { cursor: grab; }
  .chip.dragging { opacity: .35; }
  .drag-ghost {
    position: fixed; z-index: 70; pointer-events: none; margin: 0;
    transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 10px 24px rgba(0,0,0,.3);
  }
  .slot.drop-hover { background: var(--soft); outline: 3px solid var(--butter); outline-offset: 2px; }
  /* 格子疊在插圖上(assign 的 board) */
  .board { position: relative; max-width: 440px; margin: 0 auto 14px; }
  .board > svg, .board > img { display: block; width: 100%; height: auto; }
  .board-slots { position: absolute; inset: 0; }
  .board-slots .slot {
    position: absolute; transform: translate(-50%, -50%); min-height: 0; min-width: 64px; padding: 4px 8px;
    background: var(--paper); opacity: .92; border-radius: 10px;
  }
  .board-slots .slot .slot-label { font-size: .75rem; }
  .board-slots .slot .slot-item { font-size: .95rem; min-height: 1.2em; }
  .board-slots .slot { white-space: nowrap; }
  @media (max-width: 420px) {
    .board-slots .slot { min-width: 44px; padding: 2px 5px; }
    .board-slots .slot .slot-label { font-size: .65rem; }
    .board-slots .slot .slot-item { font-size: .8rem; }
  }
  /* 疊圖對齊 / 定位 */
  .align-box { position: relative; max-width: 440px; margin: 4px auto 8px; user-select: none; -webkit-user-select: none; overflow: hidden; }
  .align-box > svg, .align-box > img { display: block; width: 100%; height: auto; }
  .align-overlay {
    position: absolute; transform: translate(-50%, -50%); cursor: grab; touch-action: none;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); transition: filter .2s;
  }
  .align-overlay > svg, .align-overlay > img { display: block; width: 100%; height: auto; }
  .align-overlay.dragging { cursor: grabbing; filter: drop-shadow(0 8px 14px rgba(0,0,0,.45)); }
  .align-overlay.locked { cursor: default; filter: none; }
  .align-overlay:focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }
  .align-pin { font-size: 2rem; line-height: 1; text-align: center; transform: translateY(-45%); }   /* 圖釘的尖端對準位置 */
  .aligned .align-overlay { animation: pop .3s ease; }
  .align-tip { text-align: center; font-size: .8rem; color: var(--muted); margin: 0 0 10px; font-weight: 400; }
  .align-after { margin-top: 8px; }
  .aligned .align-tip { display: none; }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .feedback { min-height: 28px; font-size: 1.05rem; font-weight: 700; margin: 6px 0 4px; text-align: center; line-height: 1.6; white-space: pre-line; }
  .feedback.good { color: var(--good-text); }
  .feedback.bad { color: var(--bad); }
  .hidden { display: none !important; }
  /* 通關畫面:展示收集到的所有徽章(字精靈) */
  .badge-wall { margin: 16px 0 4px; text-align: center; }
  .badge-wall h3 { margin: 0 0 10px; font-size: 1.05rem; letter-spacing: .12em; }
  .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .badge {
    background: var(--surface); border: calc(var(--bw) + .5px) solid var(--edge); border-radius: var(--radius);
    padding: 10px 6px 8px; box-shadow: var(--pop); animation: pop .5s ease both; animation-delay: var(--d, 0s);
  }
  .badge .badge-ico { display: flex; justify-content: center; font-size: 2.4rem; line-height: 1.2; }
  .badge .badge-ico svg { width: 64px; height: 64px; display: block; }
  .badge b { display: block; margin-top: 4px; font-size: .9rem; }
  .badge small { display: block; margin-top: 2px; font-size: .72rem; color: var(--muted); line-height: 1.4; }
  .summary { background: var(--surface); border: var(--line); border-radius: var(--radius); padding: 6px 18px; margin-top: 12px; }
  .summary-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 2px dashed var(--lav); font-size: 1.05rem; }
  .summary-row:last-child { border-bottom: none; }
  .summary-row span:last-child { font-weight: 700; }
  .level-errors { background: #fff0f1; border: 3px solid var(--bad); border-radius: 18px; color: #c62836; font-size: .9rem; line-height: 1.6; margin: 0 0 16px; padding: 12px 16px; }
  .level-errors ul { margin: 6px 0 0; padding-left: 20px; }
  .level-warnings { background: #fff8e1; border: 3px solid #ffd86b; border-radius: 18px; color: #8a6d00; font-size: .9rem; line-height: 1.6; margin: 0 0 16px; padding: 12px 16px; }
  .level-warnings ul { margin: 6px 0 0; padding-left: 20px; }
  input.text-answer { font-size: 1.4rem; text-align: center; margin-bottom: 14px; }
  .explain { background: var(--clue-bg); color: var(--clue-ink); border: var(--line); border-radius: var(--radius); padding: 12px 16px; margin: 8px 0 14px; line-height: 1.7; white-space: pre-line; }
  .next-wrap { margin-top: 6px; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 6px 0 14px; min-height: 58px; }
  .chip { border: var(--line); border-radius: var(--radius); background: var(--surface); padding: 10px 14px; font-size: 1.15rem; font-weight: 700; box-shadow: var(--pop); transition: transform .1s; }
  .chip:disabled { opacity: .6; }
  .chip-slot { background: var(--soft); }
  .submit-status { color: var(--muted); font-size: .9rem; margin-top: 14px; text-align: center; }

  /* ----- 提示視窗、浮動訊息 ----- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal {
    width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; background: var(--paper); color: var(--ink);
    border: var(--line); border-radius: var(--card-radius); padding: 22px 22px 24px; box-shadow: var(--card-shadow);
    animation: fadeUp .25s ease;
  }
  .modal h2 { margin: 0 0 12px; font-size: 1.3rem; text-align: center; }
  .hint-tier { background: var(--clue-bg); color: var(--clue-ink); border: var(--line); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 10px; line-height: 1.7; }
  .hint-tier b { display: block; font-size: .85rem; opacity: .75; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 60; max-width: 90vw;
    background: var(--ink); color: var(--paper); border-radius: 999px; padding: 10px 20px; font-weight: 700; font-size: .95rem;
    box-shadow: 0 6px 20px rgba(0,0,0,.35); animation: fadeToast 2.6s ease forwards; pointer-events: none;
  }
  @keyframes fadeToast { 0% { opacity: 0; } 10%, 85% { opacity: 1; } 100% { opacity: 0; } }
  /* terminal 主題的掃描線 */
  :root[data-theme="terminal"] body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 100; opacity: .5;
    background: linear-gradient(rgba(0,0,0,0) 50%, rgba(0,0,0,.25) 50%); background-size: 100% 3px;
  }

  @media (max-width: 420px) {
    .card { padding: 24px 16px 22px; }
    .key { min-height: 66px; font-size: 1.8rem; }
    .passcode-slot { width: 48px; height: 58px; font-size: 1.7rem; }
    .wheel-btn, .wheel-val { min-width: 48px; }
    .step { width: 22px; height: 22px; font-size: .7rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- 吉祥物圖形:定義一次,三個畫面共用 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="mascot-shape">
      <path d="M20 70 C10 40 30 12 60 12 C90 12 110 40 100 70 C96 86 80 92 60 92 C40 92 24 86 20 70 Z" fill="#ffe3ec" stroke="#3b3355" stroke-width="4"/>
      <path d="M40 16 L34 2 L48 12 Z M80 16 L86 2 L72 12 Z" fill="#ffe3ec" stroke="#3b3355" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="44" cy="52" r="5" fill="#3b3355"/>
      <circle cx="76" cy="52" r="5" fill="#3b3355"/>
      <ellipse cx="34" cy="64" rx="7" ry="4" fill="#ff8fb1" opacity=".7"/>
      <ellipse cx="86" cy="64" rx="7" ry="4" fill="#ff8fb1" opacity=".7"/>
    </g>
  </defs>
</svg>

<div class="card" id="card">

  <!-- ===== 畫面一:開始畫面 ===== -->
  <div id="screen-start">
    <svg class="mascot" viewBox="0 0 120 96" aria-hidden="true">
      <use href="#mascot-shape"/>
      <path class="mouth-idle" d="M54 64 Q60 70 66 64" fill="none" stroke="#3b3355" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <div class="icon-badge" data-icon="game" aria-hidden="true"></div>
    <h1 id="game-title">闖關小冒險</h1>
    <p class="desc" id="game-desc">輸入你的名字,一關一關往前走吧!</p>
    <div class="story hidden" id="game-story"></div>
    <details class="teacher hidden" id="teacher-notes"><summary>給老師</summary><div id="teacher-text"></div></details>
    <div class="level-errors hidden" id="level-errors" role="alert"></div>
    <div class="level-warnings hidden" id="level-warnings"></div>
    <input type="text" id="player-name" placeholder="你的名字或暱稱">
    <button class="btn-primary" id="btn-start">開始闖關</button>
    <button class="btn-secondary hidden" id="btn-reset">從頭開始</button>
  </div>

  <!-- ===== 畫面二:遊戲進行中 ===== -->
  <div id="screen-game" class="hidden">
    <div class="game-head">
      <svg class="mascot small" id="game-mascot" viewBox="0 0 120 96" aria-hidden="true">
        <use href="#mascot-shape"/>
        <path class="mouth-idle" d="M54 64 Q60 70 66 64" fill="none" stroke="#3b3355" stroke-width="4" stroke-linecap="round"/>
        <path class="mouth-happy" d="M50 62 Q60 76 70 62 Z" fill="#3b3355"/>
        <path class="mouth-sad" d="M53 70 Q60 62 67 70" fill="none" stroke="#3b3355" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <div class="icon-badge small" id="game-icon" data-icon="game" aria-hidden="true"></div>
      <div class="progress-area">
        <div class="stepper hidden" id="stepper" aria-hidden="true"></div>
        <div class="progress-wrap" id="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
      </div>
      <span class="timer hidden" id="timer" aria-label="剩餘時間"></span>
      <span class="hearts hidden" id="lives"></span>
    </div>
    <div class="toolbar">
      <div class="inventory hidden" id="inventory" aria-label="道具袋"></div>
      <button class="tool-btn hidden" id="btn-hint">💡 提示</button>
      <button class="tool-btn" id="btn-sound" aria-label="音效開關">🔊</button>
    </div>

    <div class="level-body" id="level-body">
      <div class="level-title" id="level-title"></div>
      <p class="scene hidden" id="scene"></p>
      <div class="art hidden" id="art"></div>
      <div id="clues"></div>
      <div class="qa-box">

<script>
(function () {
  let shown = false;
  window.addEventListener("error", function (e) {
    if (window.__engineReady || shown) return;      // 只處理「遊戲還沒準備好」時的第一個錯誤
    shown = true;
    const box = document.getElementById("level-errors");
    const btn = document.getElementById("btn-start");
    if (btn) btn.disabled = true;
    if (!box) return;
    const where = e.lineno ? `(這個檔案的第 ${e.lineno} 行附近)` : "";
    box.textContent = `程式有錯誤,遊戲無法開始${where}:${e.message || "未知的錯誤"}。`
      + "最常見的原因是漏了逗號、引號或括號沒有成對,請修正後重新整理。";
    box.classList.remove("hidden");
  });
})();
</script>

<script>

/* =========================================================

/* 遊戲狀態(不要改既有欄位名稱,底下的函式都依賴這些欄位) */
let state = {
  currentLevel: 0,
  correctCount: 0,

  lives: 0,        // 剩幾顆愛心(GAME.lives 大於 0 時才有意義)

  stars: [],       // 每個已通過的關卡拿到幾顆星
  items: [],       // 已經拿到的道具 id
  hintsUsed: 0,    // 整場看了幾層提示
  levelHints: 0,   // 目前這一關看了幾層提示

const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };

const isText = (s) => typeof s === "string" && !!s.trim();
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {

  }

}
const ITEM_DEFS = (typeof ITEMS !== "undefined" && ITEMS) ? ITEMS : {};

const hintsOf = (level) => (Array.isArray(level.hints) && level.hints.length) ? level.hints : (level.hint ? [level.hint] : []);

/* ---------- 規則的預設版本 ----------
   第二部分沒有寫某個函式時,引擎改用這裡的版本。引擎一律透過 rule("名稱", ...參數) 呼叫 */
const DEFAULT_RULES = {
  levelStars(wrongTries, level, hintsUsed) {
    const n = wrongTries + Math.max(0, (hintsUsed || 0) - 1);
    return n === 0 ? 3 : n === 1 ? 2 : 1;
  },
  summaryRows(info) {
    const rows = [["玩家", info.playerName], ["通過關卡", `${info.levelsPassed} / ${info.totalLevels}`], ["答錯次數", String(info.wrongCount)]];
    if (LEVELS.some(lv => hintsOf(lv).length > 1)) rows.push(["看了幾層提示", String(info.hintsUsed)]);
    if (GAME.showStars) rows.push(["獲得星星", `${info.totalStars} / ${info.totalLevels * 3}`]);
    rows.push(["花費時間", `${info.durationSec} 秒`]);

function rule(name, ...args) {

}

/* ---------- 音效(Web Audio 合成,不用音檔)與浮動訊息 ---------- */
let audioCtx = null;

function tone(freq, dur = 0.15, type = "sine", vol = 0.08, delay = 0) {
  if (!soundOn) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = audioCtx || new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + dur);
